<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Games</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Wikigames</div>
            <div class="nav-buttons">
                <a href="signup.html">
                <button class="btn-sign-in">Sign in</button>
                </a>
                <button class="btn-register">Register</button>
            </div>
        </nav>
    </header>

    <main>
        <aside class="sidebar">
            <div class="filters">
                <div class="filter-group">
                    <h3>Categories</h3>
                    <ul>
                        <li><label><input type="checkbox" checked> Label</label></li>
                        <li><label><input type="checkbox" checked> Label</label></li>
                        <li><label><input type="checkbox" checked> Label</label></li>
                    </ul>
                </div>

                <div class="filter-group">
                    <h3>Price Range</h3>
                    <div class="price-range">
                        <input type="range" min="0" max="100" value="50">
                        <div class="price-labels">
                            <span>$0</span>
                            <span>$100</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <section class="products">
            <div class="search-bar">
                <input type="text" placeholder="Search">
                <div class="sort-buttons">
                    <button class="active">New</button>
                    <button>Price ascending</button>
                    <button>Price descending</button>
                    <button>Rating</button>
                </div>
            </div>
        
            <div id="games-container" class="product-grid">
                <!-- Les jeux seront chargés ici -->
            </div>
            <div>
                <button id="prev-btn">Précédent</button>
                <button id="next-btn">Suivant</button>
            </div>
        </section>
        
    </main>
    <script src="/static/js/product.js"></script>
</body>
</html>
