<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Wiki Games</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">
                <div class="logo">Wikigames</div>
            </a>
            <div class="nav-buttons">
                <a href="signup.html">
                    <button class="btn-sign-in">Sign in</button>
                </a>
                <button class="btn-register">Register</button>
            </div>
        </nav>
    </header>

    <main class="product-details">
        <div class="product-container">
            <div class="product-image" id="product-image"></div>
            <div class="product-info">
                <h1 id="product-name">Name product</h1>
                <p id="product-description">Description du produit...</p>
                <div class="year">Published in: <span id="product-year">Year</span></div>
                <button class="btn-purchase">Pay Now</button>
            </div>
        </div>

        <section class="reviews">
            <h2>Latest reviews</h2>
            <div id="review-grid" class="review-grid">
                <!-- Reviews will be inserted here -->
            </div>

            <div class="comment-section">
                <h3>Leave a comment</h3>
                <textarea placeholder="Your comment"></textarea>
                <button class="btn-submit">Reply</button>
            </div>
        </section>
    </main>
</body>
</html>
